name: Build

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  QT_VERSION: '6.10.3'
  TARGET_NAME: 'EZ4Connect'
  DISPLAY_NAME: 'EZ4Connect Pro'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      mac_only: ${{ steps.version.outputs.mac_only }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: use v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$VERSION" == *-* || "$VERSION" == v0.0.7 || "$VERSION" == v0.0.8 ]]; then prerelease=true; fi
          mac_only=false
          if [[ "$VERSION" == v0.0.7 || "$VERSION" == v0.0.8 ]]; then mac_only=true; fi
          {
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
            echo "mac_only=$mac_only"
          } >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat qtpositioning qtserialport qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux_gcc_64'

      - name: Configure tests
        run: |
          cmake -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -S . -B build

      - name: Build tests
        run: |
          cmake --build build --config Release --parallel $(nproc)

      - name: Run tests
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

  build-windows-x64:
    needs: metadata
    if: needs.metadata.outputs.mac_only != 'true'
    runs-on: windows-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtpositioning qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-win64_msvc2022_64'

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $VER = $env:RELEASE_VERSION.Substring(1)
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="$VER" -DCMAKE_BUILD_TYPE=Release -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --config Release --parallel $(nproc)

      - name: Download and copy files
        shell: pwsh
        run: |
          .\scripts\deploy-windows.ps1 -TargetName "${{ env.TARGET_NAME }}" -DisplayName "${{ env.DISPLAY_NAME }}" -BuildDir "build" -Architecture "amd64" -Nightly false
          Compress-Archive -Path "${{ env.DISPLAY_NAME }}" -DestinationPath ${{ env.ARCHIVE_NAME }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.zip

  build-windows-arm64:
    needs: metadata
    if: needs.metadata.outputs.mac_only != 'true'
    runs-on: windows-11-arm
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-windows-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows_arm64'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64'
          modules: 'qt5compat qtpositioning qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-win64_msvc2022_arm64'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'  # workaround for Qt6 WebEngine on Windows ARM64

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $VER = $env:RELEASE_VERSION.Substring(1)
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="$VER" -DCMAKE_BUILD_TYPE=Release -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --config Release --parallel $(nproc)

      - name: Download and copy files
        shell: pwsh
        run: |
          .\scripts\deploy-windows.ps1 -TargetName "${{ env.TARGET_NAME }}" -DisplayName "${{ env.DISPLAY_NAME }}" -BuildDir "build" -Architecture "arm64" -Nightly false
          Compress-Archive -Path "${{ env.DISPLAY_NAME }}" -DestinationPath ${{ env.ARCHIVE_NAME }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.zip

  build-macos-x64:
    needs: metadata
    if: needs.metadata.outputs.mac_only != 'true'
    runs-on: macos-15-intel
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-macos-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt5compat qtpositioning qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-macos_clang_x64'

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="${RELEASE_VERSION#v}" -DCMAKE_OSX_ARCHITECTURES="x86_64" -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --parallel $(nproc)

      - name: Download and copy files
        run: |
          ./scripts/deploy-macos.sh "${{ env.TARGET_NAME }}" "build" "x86_64" "false"

      - name: Check macOS signing configuration
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          count=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_CERT_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No signing secrets configured; the macOS DMG will be unsigned and not notarized.'
          elif [[ "$count" == 6 ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Configure all six macOS signing and notarization secrets, or none.' >&2
            exit 1
          fi

      - name: Import macOS signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-keychain
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macos_signing_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERTIFICATE_PATH" || echo "$MACOS_CERT_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign app bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          ./scripts/macos-sign-app.sh "./${{ env.TARGET_NAME }}.app"

      - name: Sign app bundle locally
        if: steps.signing.outputs.enabled != 'true'
        run: |
          codesign --force --deep --sign - --preserve-metadata=entitlements "./${{ env.TARGET_NAME }}.app"

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict "./${{ env.TARGET_NAME }}.app"

      - name: Package dmg file
        run: |
          brew install create-dmg
          swift scripts/dmg-background.swift "$RUNNER_TEMP/dmg-background.png"
          mkdir dmg-build
          create-dmg \
            --volname "${{ env.DISPLAY_NAME }}" \
            --volicon ./resource/icon.icns \
            --background "$RUNNER_TEMP/dmg-background.png" \
            --window-size 680 340 \
            --app-drop-link 470 145 \
            --add-file "${{ env.DISPLAY_NAME }}.app" "./${{ env.TARGET_NAME }}.app" 210 145 \
            --filesystem APFS \
            ${{ env.ARCHIVE_NAME }}.dmg dmg-build

      - name: Notarize and staple dmg
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/macos-notarize-dmg.sh "${{ env.ARCHIVE_NAME }}.dmg"

      - name: Upload artifact (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.dmg
  build-macos-arm64:
    needs: metadata
    runs-on: macos-15
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt5compat qtpositioning qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-macos_clang_arm64'

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="${RELEASE_VERSION#v}" -DCMAKE_OSX_ARCHITECTURES="arm64" -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --parallel $(nproc)

      - name: Download and copy files
        run: |
          ./scripts/deploy-macos.sh "${{ env.TARGET_NAME }}" "build" "arm64" "false"

      - name: Check macOS signing configuration
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          count=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_CERT_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No signing secrets configured; the macOS DMG will be unsigned and not notarized.'
          elif [[ "$count" == 6 ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Configure all six macOS signing and notarization secrets, or none.' >&2
            exit 1
          fi

      - name: Import macOS signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-keychain
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macos_signing_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERTIFICATE_PATH" || echo "$MACOS_CERT_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign app bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          ./scripts/macos-sign-app.sh "./${{ env.TARGET_NAME }}.app"

      - name: Sign app bundle locally
        if: steps.signing.outputs.enabled != 'true'
        run: |
          codesign --force --deep --sign - --preserve-metadata=entitlements "./${{ env.TARGET_NAME }}.app"

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict "./${{ env.TARGET_NAME }}.app"

      - name: Package dmg file
        run: |
          brew install create-dmg
          swift scripts/dmg-background.swift "$RUNNER_TEMP/dmg-background.png"
          mkdir dmg-build
          create-dmg \
            --volname "${{ env.DISPLAY_NAME }}" \
            --volicon ./resource/icon.icns \
            --background "$RUNNER_TEMP/dmg-background.png" \
            --window-size 680 340 \
            --app-drop-link 470 145 \
            --add-file "${{ env.DISPLAY_NAME }}.app" "./${{ env.TARGET_NAME }}.app" 210 145 \
            --filesystem APFS \
            ${{ env.ARCHIVE_NAME }}.dmg dmg-build

      - name: Notarize and staple dmg
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/macos-notarize-dmg.sh "${{ env.ARCHIVE_NAME }}.dmg"

      - name: Upload artifact (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.dmg
  build-linux-x64:
    needs: metadata
    if: needs.metadata.outputs.mac_only != 'true'
    runs-on: ubuntu-22.04
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat qtpositioning qtserialport qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux_gcc_64'

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="${RELEASE_VERSION#v}" -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --parallel $(nproc)

      - name: Download and copy files
        run: |
          ./scripts/deploy-linux.sh "${{ env.TARGET_NAME }}" "${{ env.DISPLAY_NAME }}" "build" "x86_64" "false"
          mv *.AppImage ${{ env.ARCHIVE_NAME }}.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.AppImage

  build-linux-arm64:
    needs: metadata
    if: needs.metadata.outputs.mac_only != 'true'
    runs-on: ubuntu-24.04-arm
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-linux-arm64
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-2.1-7t64 libminizip1t64

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          modules: 'qt5compat qtpositioning qtserialport qtwebchannel qtwebengine'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-linux_arm64'

      - name: Configure
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cmake -DNIGHTLY_BUILD=OFF -DREL_VER="${RELEASE_VERSION#v}" -S . -B build

      - name: Build
        run: |
          cmake --build build --target ${{ env.TARGET_NAME }} --parallel $(nproc)

      - name: Download and copy files
        run: |
          ./scripts/deploy-linux.sh "${{ env.TARGET_NAME }}" "${{ env.DISPLAY_NAME }}" "build" "arm64" "false"
          mv *.AppImage ${{ env.ARCHIVE_NAME }}.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.AppImage

  release:
    needs:
      - metadata
      - unit-tests
      - build-windows-x64
      - build-windows-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-linux-x64
      - build-linux-arm64
    if: >-
      ${{ always() && needs.metadata.result == 'success' && needs.unit-tests.result == 'success'
          && needs.build-macos-arm64.result == 'success'
          && (needs.metadata.outputs.mac_only == 'true'
              || (needs.build-windows-x64.result == 'success'
                  && needs.build-windows-arm64.result == 'success'
                  && needs.build-macos-x64.result == 'success'
                  && needs.build-linux-x64.result == 'success'
                  && needs.build-linux-arm64.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.version }}
          PREFIX: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          MAC_ONLY: ${{ needs.metadata.outputs.mac_only }}
        run: |
          set -euo pipefail
          assets=("release-assets/$PREFIX-macos-arm64.dmg")
          if [[ "$MAC_ONLY" != true ]]; then
            assets+=(
              "release-assets/$PREFIX-windows-x64.zip"
              "release-assets/$PREFIX-windows-arm64.zip"
              "release-assets/$PREFIX-macos-x64.dmg"
              "release-assets/$PREFIX-linux-x64.AppImage"
              "release-assets/$PREFIX-linux-arm64.AppImage"
            )
          fi
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi
      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.version }}
          PREFIX: ${{ github.event.repository.name }}-${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          asset="release-assets/$PREFIX-macos-arm64.dmg"
          sha=$(sha256sum "$asset" | cut -d ' ' -f 1)
          size=$(stat -c %s "$asset")
          url="https://github.com/$GH_REPO/releases/download/$TAG/$PREFIX-macos-arm64.dmg"
          jq -n --arg version "$TAG" --arg url "$url" --arg sha "$sha" --argjson size "$size" \
            '{version:$version, assets:{"macos-arm64":{url:$url, sha256:$sha, size:$size}}}' > "$RUNNER_TEMP/update.json"
          encoded=$(base64 -w0 "$RUNNER_TEMP/update.json")
          current=$(gh api "repos/$GH_REPO/contents/updates/latest.json" --jq .sha 2>/dev/null || true)
          jq -n --arg message "chore: publish update manifest for $TAG" --arg content "$encoded" --arg sha "$current" \
            '{message:$message,content:$content} + (if $sha == "" then {} else {sha:$sha} end)' > "$RUNNER_TEMP/update-request.json"
          gh api --method PUT "repos/$GH_REPO/contents/updates/latest.json" --input "$RUNNER_TEMP/update-request.json" >/dev/null
